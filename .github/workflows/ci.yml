name: CI Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python and pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/stats-service/requirements-dev.txt

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Run Ruff
        run: ruff check .

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python and pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/stats-service/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r services/stats-service/requirements-dev.txt

      - name: Run tests with coverage gate
        run: >-
          python -m pytest -q
          --cov=app
          --cov=src.fizzbuzz
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=60

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build stats-service container image
        run: docker build --tag good-night-stats-service:ci .
