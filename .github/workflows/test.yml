name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: browser-independent web tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run web tests
        run: node --test tests/web/*.test.mjs

  test:
    name: pytest and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r services/stats-service/requirements-dev.txt

      - name: Run tests with branch coverage
        run: >-
          python -m pytest -q
          --cov=app
          --cov=src.fizzbuzz
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=90
