:root{color-scheme:dark;--bg:#17142B;--surface:#231F3D;--surface2:#2D2850;--line:#352F5C;--primary:#6D5BD0;--hover:#5B49BC;--accent:#B8ACFF;--good:#6EE7B7;--star:#FCD34D;--warn:#FCA5A5;--t1:#F4F1FF;--t2:#A9A3C7;--tab-h:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font-family:'Noto Sans','Noto Sans Thai',sans-serif;font-size:14px;line-height:1.7;color:var(--t1);background:var(--bg)}
button{font:inherit;color:inherit}
h1{font-size:26px;font-weight:600;line-height:1.35;margin:0}
h2{font-size:16px;font-weight:600;line-height:1.5;margin:0}
.cap{font-size:13px;line-height:1.6;color:var(--t2)}.sub{font-size:12.5px;line-height:1.55;color:var(--t2)}
.inl{display:inline-flex;align-items:center;gap:8px}
.ic{width:16px;height:16px;stroke-width:1.75;flex:none}.ic.sm{width:14px;height:14px}.ic.lg{width:20px;height:20px}
.good{color:var(--good)}.low{color:var(--warn)}
/* shell */
#shell{display:flex;min-height:100dvh}
.side{width:240px;flex:none;position:sticky;top:0;height:100dvh;border-right:1px solid var(--line);padding:24px 20px;display:flex;flex-direction:column;gap:32px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:600}
.brand .lg{width:40px;height:40px;border-radius:12px;background:var(--surface);color:var(--accent);display:flex;align-items:center;justify-content:center}.brand .lg .ic{width:22px;height:22px}
.nav{display:flex;flex-direction:column;gap:8px}
.nv{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:none;border:0;color:var(--t2);cursor:pointer;text-align:left;font-size:14px;min-height:48px}
.nv:hover{background:rgba(139,124,246,.08)}.nv[aria-current=page]{background:var(--surface);color:var(--accent);font-weight:600}
.nv .ic{width:20px;height:20px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100dvh}
.top{height:76px;border-bottom:1px solid var(--line);padding:0 40px;display:flex;align-items:center;justify-content:space-between;color:var(--t2);font-size:13px;flex:none}
.page{width:100%;max-width:1200px;margin:0 auto;padding:40px;display:flex;flex-direction:column;gap:28px;flex:1}
.foot{border-top:1px solid var(--line);margin:0 40px;padding:20px 0;display:flex;gap:16px;align-items:baseline;color:var(--t2);font-size:13px}.foot b{color:var(--accent);font-size:16px;font-weight:600}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
/* grids */
.g{display:grid;gap:24px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.gm{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:24px;min-width:0}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.card.focus{border-color:rgba(139,124,246,.5);background:linear-gradient(180deg,rgba(139,124,246,.16),var(--surface) 75%)}
.card.note{background:rgba(252,165,165,.07);border-color:rgba(252,165,165,.35)}
.stat .v{font-size:30px;font-weight:600;line-height:1.25;font-variant-numeric:tabular-nums}.stat .v .sub{font-size:16px}
.big{font-size:44px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}.big .sub{font-size:18px}
.pg{height:8px;border-radius:99px;background:rgba(139,124,246,.2);overflow:hidden}.pg i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#9B8DF5,#6D5BD0)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}
.pill{font-size:12px;color:var(--t2);background:var(--surface2);border-radius:999px;padding:4px 12px;white-space:nowrap}
.tag{font-size:11.5px;color:var(--t2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;align-self:flex-start}
.stars{display:inline-flex;gap:2px}.stars .ic{width:16px;height:16px;color:var(--star)}.stars .ic.fill{fill:var(--star)}
/* buttons */
.btn,.btn2{font-size:14px;font-weight:500;min-height:46px;border-radius:14px;padding:8px 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap}
.btn{background:var(--primary);color:#fff;border:0;box-shadow:0 0 18px rgba(139,124,246,.3)}.btn:hover{background:var(--hover)}
.btn2{background:transparent;color:#D8D2F2;border:1px solid #4A4377}.btn2:hover{background:rgba(139,124,246,.08)}
.btn2.danger{color:var(--warn);border-color:rgba(252,165,165,.45)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}.btn:active,.btn2:active{transform:scale(.98)}
.btn.block{width:100%}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* form */
.fld{display:flex;flex-direction:column;gap:8px;min-width:0}.lbl{display:inline-flex;align-items:center;gap:8px;color:var(--t2);font-size:13px}.lbl .ic{color:var(--accent)}
.tbox{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.tbox input{background:transparent;border:0;color:var(--t1);font:inherit;font-size:30px;font-weight:600;padding:0;width:100%;font-variant-numeric:tabular-nums;outline:none}
.tbox:focus-within{border-color:#8B7CF6;box-shadow:0 0 0 3px rgba(139,124,246,.25)}
.dtin{background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--t1);font:inherit;font-size:14px;padding:8px 12px;min-height:44px}
.dtin:focus{border-color:#8B7CF6;outline:none}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.opt{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:72px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;cursor:pointer}
.opt b{font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}.opt b .ic{color:var(--accent)}
.opt:hover{border-color:#4A4377}.opt[aria-checked=true]{background:var(--surface2);border-color:#8B7CF6;box-shadow:0 0 0 1px #8B7CF6 inset}
.rates{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.rt{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 6px;min-height:76px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.rt b{font-size:22px;font-weight:600}.rt span{font-size:12px;color:var(--t2)}
.rt[aria-checked=true]{background:var(--surface2);border-color:#A5A0F0}.rt[aria-checked=true] b{color:var(--star)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chip{display:flex;align-items:center;gap:8px;background:var(--bg);color:var(--t2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:48px;cursor:pointer;text-align:left}
.chip .ck{margin-left:auto;opacity:0;color:var(--accent)}.chip[aria-pressed=true]{background:var(--surface2);border-color:#8B7CF6;color:var(--t1)}.chip[aria-pressed=true] .ck{opacity:1}
.ta{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;color:var(--t1);font:inherit;padding:12px 14px;resize:vertical;min-height:88px;line-height:1.6}.ta:focus{border-color:#8B7CF6;outline:none;box-shadow:0 0 0 3px rgba(139,124,246,.25)}
.ta::placeholder{color:var(--t2)}
.res{border-radius:20px;padding:20px 24px;background:rgba(52,211,153,.08);border:1px solid rgba(110,231,183,.35);display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.res .x{display:flex;flex-direction:column;gap:2px}.res .x b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.res .m{grid-column:1/-1}
.res.err{background:rgba(252,165,165,.08);border-color:rgba(252,165,165,.45)}.res.err .m{color:var(--warn)}
.actions{border-top:1px solid var(--line);padding-top:20px;display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}
/* lists */
.thead,.row{display:grid;grid-template-columns:2fr 1.4fr 1.6fr 1.8fr 24px;gap:16px;align-items:center}
.thead{padding:0 4px 12px;color:var(--t2);font-size:12.5px;border-bottom:1px solid var(--line)}
.row{width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:18px 4px;text-align:left;cursor:pointer;color:inherit}
.row:last-child{border-bottom:0}.row:hover{background:rgba(139,124,246,.05)}

      '<div class="legend">' + o.legend + '<span><s class="nil"></s>วันที่ไม่ได้บันทึก</span></div>';

  /* local-mode accounts (used only when no server is configured) */
  function localRegister() {
    var name = document.getElementById('u').value.trim(), p1 = document.getElementById('p').value, p2 = document.getElementById('p2').value;
    if (name.length < 2 || name.length > 30) return aerr('ชื่อผู้ใช้ต้องยาว 2–30 ตัวอักษร');
    if (users().some(function (x) { return x.name.toLowerCase() === name.toLowerCase(); })) return aerr('มีชื่อผู้ใช้นี้ในเครื่องนี้แล้ว');
    if (p1.length < PW_MIN) return aerr('รหัสผ่านต้องมีอย่างน้อย ' + PW_MIN + ' ตัวอักษร');
    if (window.GNBcrypt && GNBcrypt.tooLong(p1)) return aerr('รหัสผ่านยาวเกินไป (ไม่เกิน 72 ไบต์)');
    if (p1 !== p2) return aerr('รหัสผ่านสองช่องไม่ตรงกัน');
    if (!(document.getElementById('cons') || {}).checked) return aerr('ต้องยอมรับนโยบายความเป็นส่วนตัวก่อนสร้างบัญชี');
    busy(true); aerr('');
    var u = { id: rand(6), name: name, alg: 'bcrypt', consent: newConsent() };
    GNBcrypt.hash(p1, GNBcrypt.COST).then(function (h) {
      u.hash = h; var list = users(); list.push(u); wr('gn.users', list);
      var legacy = rd('gn.v1'); if (legacy && Array.isArray(legacy.entries) && list.length === 1) { wr('gn.data.' + u.id, { entries: legacy.entries, goal: legacy.goal || 480 }); rmk('gn.v1'); }
      enter(u, true);
    }).catch(function () { busy(false); aerr('สร้างบัญชีไม่สำเร็จ ลองใหม่อีกครั้ง'); });
  }
  /* bcrypt accounts verify directly; older PBKDF2/SHA accounts verify the old way and are upgraded to bcrypt on the spot */
  function verifyLocal(u, pw) {
    if (u.alg === 'bcrypt') return GNBcrypt.compare(pw, u.hash);
    return hashPw(pw, u.salt, u.alg || 'pbkdf2').then(function (h) {
      if (h !== u.hash) return false;
      return GNBcrypt.hash(pw, GNBcrypt.COST).then(function (nh) {
        var list = users(); list.forEach(function (x) { if (x.id === u.id) { x.alg = 'bcrypt'; x.hash = nh; delete x.salt; } }); wr('gn.users', list); return true;
      }, function () { return true; });
    });
  }

    busy(true); aerr('');
    (u ? verifyLocal(u, pw) : GNBcrypt.hash(pw, GNBcrypt.COST).then(function () { return false; })).then(function (ok) {
      if (ok) enter(u); else { busy(false); aerr('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'); }
    }).catch(function () { busy(false); aerr('เข้าสู่ระบบไม่สำเร็จ ลองใหม่อีกครั้ง'); });
  }

    }
    else if (a === 'swake') {
      var fr = G.finishSession(S.active, new Date(), tzName());

        else if (fr.reason === 'negative') toast('เวลาตื่นอยู่ก่อนเวลาเริ่มนอน ตรวจสอบนาฬิกาเครื่องแล้วลองใหม่');
        else { S.active = null; render(); }
        return;
      }
      draft = draftFromSession(fr); nav('log', true);
    }
    else if (a === 'scancel') confirmBox('ยกเลิกการนับการนอน?', 'เวลาเริ่มนอนที่บันทึกไว้จะถูกทิ้ง (ยังบันทึกเวลาเองในหน้าบันทึกได้)', 'ยกเลิก session', function () { S.active = null; persistPrefs(); render(); toast('ยกเลิกแล้ว'); });
    else if (a === 'dstep') { var dc = HM[el.dataset.f], dv = Math.max(GMIN, Math.min(GMAX, dc.get() + (+el.dataset.d))); dc.set(dv); writeHM(el.dataset.f, dv); hmErr(el.dataset.f, ''); if (dc.page && route === 'settings') render(); }
    else if (a === 'cstep') { var cc = HM[el.dataset.f], cur = cc.get(), cv = cur === null || cur === undefined ? 23 * 60 : (((cur + (+el.dataset.d)) % 1440) + 1440) % 1440; cc.set(cv); writeHM(el.dataset.f, cv); if (cc.page && route === 'settings') render(); }
    else if (a === 'cclear') { var xc = HM[el.dataset.f]; xc.set(null); writeHM(el.dataset.f, null); if (xc.page && route === 'settings') render(); }
    else if (a === 'ageopen') { ageOpen = !ageOpen; el.setAttribute('aria-expanded', String(ageOpen)); var ab = $i('ageBox'); if (ab) { ab.hidden = !ageOpen; ab.innerHTML = ageInner(); var ai = $i('age'); if (ai) ai.focus(); var rb0 = $i('recBox'); if (rb0) rb0.innerHTML = recHtml(route === 'settings' ? S.goal : obGoal); try { lucide.createIcons(); } catch (e) {} } }
    else if (a === 'logmode') { logMode = el.dataset.v; if (!draft || draft.editing) draft = newDraft(); render(); }
    else if (a === 'logmanual') { draft = newDraft(); logMode = 'manual'; nav('log', true); }
    else if (a === 'sugok') { setGoalBed(+el.dataset.v); render(); toast('ตั้งเป้าเข้านอน ' + G.fmtT(+el.dataset.v) + ' แล้ว · จะสรุปผลให้หลัง 7 วัน'); }
    else if (a === 'sugno') { S.sugDismissed = today(); persistPrefs(); render(); }
    else if (a === 'revok') { S.reviewDone = S.goalBedSince; persistPrefs(); render(); }
    else if (a === 'goals') openGoals();
    else if (a === 'photo') openPhoto();
    else if (a === 'pfname') openName();
    else if (a === 'avdel') { avDraft = ''; var ap = $i('avPrev'); if (ap) ap.innerHTML = avPreview(); }
    else if (a === 'avsave') { S.avatar = avDraft || null; persistPrefs(); var ova = el.closest('.ov'); if (ova) ova.remove(); render(); toast('บันทึกรูปโปรไฟล์แล้ว'); }
    else if (a === 'namesave') {
      var nmv = (($i('pfName') || {}).value || '').trim();
      if (nmv.length < 1 || nmv.length > 30) { $i('pfErr').textContent = 'ชื่อต้องยาว 1–30 ตัวอักษร'; return; }
      S.displayName = nmv; persistPrefs(); var ovn = el.closest('.ov'); if (ovn) ovn.remove(); render(); toast('บันทึกชื่อแล้ว');
    }
    else if (a === 'selon') { selMode = true; sel = {}; render(); }
    else if (a === 'seloff') { selMode = false; sel = {}; render(); }
    else if (a === 'selrow') { var sd = el.dataset.date; if (sel[sd]) delete sel[sd]; else sel[sd] = true; render(); }
    else if (a === 'selall') { var hl = histList(), allOn = hl.every(function (e) { return sel[e.date]; }); sel = {}; if (!allOn) hl.forEach(function (e) { sel[e.date] = true; }); render(); }
    else if (a === 'seldel') {
      var dates = Object.keys(sel); if (!dates.length) return;
      confirmBox('ลบ ' + dates.length + ' บันทึก?', 'บันทึกที่เลือกทั้งหมด ' + dates.length + ' คืนจะถูกลบ ย้อนกลับไม่ได้ (ส่งออก CSV สำรองไว้ก่อนได้)', 'ลบ ' + dates.length + ' บันทึก', function () { removeEntries(dates); selMode = false; sel = {}; render(); toast('ลบ ' + dates.length + ' บันทึกแล้ว'); });
    }
    else if (a === 'smode') { statsMode = el.dataset.v; render(); }
    else if (a === 'mprev') { statsMonth = G.addMonths(statsMonth, -1); render(); }
    else if (a === 'mnext') { if (statsMonth < today().slice(0, 7)) { statsMonth = G.addMonths(statsMonth, 1); render(); } }
    else if (a === 'fxdetail') fxDetail(el.dataset.id);
    else if (a === 'chip') { var i = draft.factors.indexOf(el.dataset.id); if (i > -1) draft.factors.splice(i, 1); else draft.factors.push(el.dataset.id); updateLog(); }
    else if (a === 'cancel') nav(S.entries.length ? 'history' : 'home');
    else if (a === 'save') {
      var src = draft.sess || draft.keep || {}, extra = { mood: draft.mood, bedAt: src.bedAt, wakeAt: src.wakeAt, tz: src.tz, bedTz: src.bedTz };
      var e = G.makeEntry(draft.date, draft.bed, draft.wake, draft.lat, draft.awk, draft.rating, draft.factors.slice(), draft.note.trim(), spanOf(draft), extra); if (!e) return;
      if (draft.fromSession && S.active && S.active.startAt === draft.fromSession) { S.active = null; if (CLOUD) window.GNSync.markProfile(pend()); }
      putEntry(e);
      nav('home'); toast('บันทึกแล้ว · หลับจริง ' + G.fmtDur(e.asleep) + ' · ประสิทธิภาพ ' + e.eff + '%');
    }
    else if (a === 'del') confirmBox('ลบบันทึกนี้?', 'บันทึกของวันที่ ' + fmtDate(draft.date, { day: 'numeric', month: 'long', year: 'numeric' }) + ' จะถูกลบ ย้อนกลับไม่ได้', 'ลบบันทึก', function () { removeEntry(draft.date); nav('history'); toast('ลบบันทึกแล้ว'); });
    else if (a === 'seg') { histFilter = el.dataset.v; var vis = {}; histList().forEach(function (e) { if (sel[e.date]) vis[e.date] = true; }); sel = vis; render(); }
    else if (a === 'edit') { draft = newDraft(el.dataset.date); nav('log', true); }
    else if (a === 'export') {
      if (!S.entries.length) { toast('ยังไม่มีข้อมูลให้ส่งออก'); return; }
      var blob = new Blob([G.csv(S.entries, S.goal)], { type: 'text/csv;charset=utf-8' }), url = URL.createObjectURL(blob), l = document.createElement('a');
      l.href = url; l.download = 'good-night-' + today() + '.csv'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 1000); toast('ส่งออกไฟล์ CSV แล้ว');
    }
    else if (a === 'clear') { if (!S.entries.length) { toast('ยังไม่มีข้อมูลให้ลบ'); return; } confirmBox('ลบข้อมูลทั้งหมด?', 'บันทึกทั้งหมด ' + S.entries.length + ' คืนจะถูกลบ ย้อนกลับไม่ได้ (ส่งออก CSV สำรองไว้ก่อนได้)', 'ลบทั้งหมด', function () { clearEntries(); render(); toast('ลบข้อมูลทั้งหมดแล้ว'); }); }
    else if (a === 'delday') confirmBox('ลบบันทึกนี้?', 'บันทึกของวันที่ ' + fmtDate(el.dataset.date, { day: 'numeric', month: 'long', year: 'numeric' }) + ' จะถูกลบ ย้อนกลับไม่ได้', 'ลบบันทึก', function () { removeEntry(el.dataset.date); nav('history'); toast('ลบบันทึกแล้ว'); });
    else if (a === 'logout') logout();
    else if (a === 'delacct') confirmBox('ลบบัญชี ' + user.name + '?', 'บัญชีและบันทึกทั้งหมดจะถูกลบ ย้อนกลับไม่ได้ (ส่งออก CSV สำรองไว้ก่อนได้)', 'ลบบัญชี', doDeleteAccount);
    else if (a === 'privacy') { if (user && document.body.classList.contains('authed')) openPrivacy(); else showPrivacy(); }
    else if (a === 'consentok') { if (!(document.getElementById('cons') || {}).checked) { aerr('ติ๊กช่องยินยอมก่อนจึงจะใช้งานต่อได้'); return; } S.consent = newConsent(); persistPrefs(); authEl.hidden = true; authEl.innerHTML = ''; if (!S.onboarded) showOnboard(); else { document.body.classList.add('authed'); startRoute(); } }
    else if (a === 'consentno') logout(true);
    else if (a === 'withdraw') { var ovw = el.closest('.ov'); if (ovw) ovw.remove(); confirmBox('ถอนความยินยอมและลบข้อมูล?', 'บัญชีและบันทึกทั้งหมดจะถูกลบ เพราะแอปใช้งานโดยไม่มีข้อมูลไม่ได้ ย้อนกลับไม่ได้ (ส่งออก CSV สำรองไว้ก่อนได้)', 'ถอนและลบทั้งหมด', doDeleteAccount); }
    else if (a === 'syncnow') { toast('กำลังซิงก์…'); syncAndRefresh().then(function () { render(); toast(navigator.onLine ? 'ซิงก์แล้ว' : 'ออฟไลน์อยู่ จะซิงก์เมื่อมีอินเทอร์เน็ต'); }); }
    else if (a === 'login') (CLOUD ? cloudLogin : localLogin)();
    else if (a === 'register') (CLOUD ? cloudRegister : localRegister)();
    else if (a === 'sendreset') sendReset();
    else if (a === 'setpw') setNewPw();
    else if (a === 'toreg') showAuth('register');
    else if (a === 'tologin') showAuth('login');
    else if (a === 'pick') { document.getElementById('u').value = el.dataset.n; document.getElementById('p').focus(); }
    else if (a === 'obpick') { obGoal = +el.dataset.v; obTouched = true; obUpdate(); }
    else if (a === 'userec') { var rc = G.sleepRec(ageVal); if (!rc) return; if (!authEl.hidden) { obGoal = rc.mid; obTouched = true; obUpdate(); } else { setGoal(rc.mid); writeHM('goal', rc.mid); hmErr('goal', ''); var rbm = $i('recBox'); if (rbm) { rbm.innerHTML = recHtml(S.goal); try { lucide.createIcons(); } catch (e) {} } render(); toast('ตั้งเป้าหมาย ' + rc.mid / 60 + ' ชั่วโมงต่อคืนแล้ว'); } }
    else if (a === 'tstep') { touchTimes(); var fm = el.dataset.f, mm = (G.toMin(draft[fm]) + (+el.dataset.d) + 1440) % 1440; draft[fm] = G.fmtT(mm); updateLog(); }
    else if (a === 'obdone') { commitHM('ob'); commitHM('obbed'); finishOnboard(obGoal); }
    else if (a === 'obskip') { obBed = null; finishOnboard(480); }
    else if (a === 'eye') { var f = document.getElementById(el.dataset.for), show = f.type === 'password'; f.type = show ? 'text' : 'password'; el.innerHTML = ic(show ? 'eye-off' : 'eye'); el.setAttribute('aria-label', show ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน'); try { lucide.createIcons(); } catch (e) {} }
    else if (a === 'forgot') {
      if (CLOUD) { showAuth('forgot'); return; }
      var nm = document.getElementById('u').value.trim(), tu = users().filter(function (x) { return x.name.toLowerCase() === nm.toLowerCase(); })[0];
      if (!tu) { aerr('กรอกชื่อผู้ใช้ของบัญชีที่ลืมรหัสผ่านก่อน'); return; }
      confirmBox('ลืมรหัสผ่าน?', 'ข้อมูลอยู่ในเครื่องนี้และไม่มีเซิร์ฟเวอร์ จึงกู้รหัสผ่านไม่ได้ ทางเดียวคือลบบัญชี "' + tu.name + '" พร้อมบันทึกทั้งหมด แล้วสมัครใหม่', 'ลบบัญชีนี้', function () { dropAccount(tu); showAuth(users().length ? 'login' : 'register'); });
    }
    else if (a === 'install' && deferred) { deferred.prompt(); deferred.userChoice.then(function () { deferred = null; render(); }); }
  });
  document.addEventListener('focusin', function (ev) { if (ev.target.classList && ev.target.classList.contains('tpi')) try { ev.target.select(); } catch (e) {} });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' && ev.target.id === 'pfName') { var ns = document.querySelector('[data-act=namesave]'); if (ns) ns.click(); return; } if (ev.key === 'Enter' && /^(goal|ob|gbed|obbed)[HM]$/.test(ev.target.id)) { ev.target.blur(); return; } if (ev.key === 'Enter' && !authEl.hidden && ev.target.tagName === 'INPUT') { var b = document.getElementById('go'); if (b && !b.disabled) b.click(); } });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'age') {
      ageVal = t.value; var rc = G.sleepRec(ageVal);
      if (!authEl.hidden) { if (rc && !obTouched) obGoal = rc.mid; obUpdate(); }
      else { var rb = document.getElementById('recBox'); if (rb) { rb.innerHTML = recHtml(S.goal); try { lucide.createIcons(); } catch (e) {} } }
      return;
    }
    if (hmHandle(t)) return;
    if (!authEl.hidden && authEl.contains(t)) authSync();
    if (route !== 'log' || !draft) return;
    var tm = /^(bed|wake)([HM])$/.exec(t.id);
    if (tm) {
      var f = tm[1], v = t.value.replace(/\D/g, '').slice(0, 2); if (v.length === 2) { var lim = tm[2] === 'H' ? 23 : 59; if (+v > lim) v = String(lim); } t.value = v;
      var hh = document.getElementById(f + 'H').value, mi = document.getElementById(f + 'M').value;
      if (hh !== '' && mi !== '') { touchTimes(); var H = Math.min(23, +hh), Mn = Math.min(59, +mi); draft[f] = G.fmtT(H * 60 + Mn); updateLog(true); }
      if (tm[2] === 'H' && v.length === 2) { var mf = document.getElementById(f + 'M'); mf.focus(); mf.select(); }   /* move on only after the hour is saved */
      return;
    }
    if (t.id === 'note') draft.note = t.value;
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'avFile') { loadAvatar(t.files && t.files[0]); return; }
    var hm = /^(goal|ob|gbed|obbed)[HM]$/.exec(t.id); if (hm) { var gid = t.id.slice(0, -1); setTimeout(function () { var ae = document.activeElement; if (ae && ae.id && ae.id.slice(0, -1) === gid && /[HM]$/.test(ae.id)) return; commitHM(gid); }, 0); return; }
    if (!authEl.hidden && authEl.contains(t)) authSync();
    if (route === 'log' && /^(bed|wake)[HM]$/.test(t.id)) { updateLog(); return; }
    if (route === 'log' && t.id === 'bedDate' && t.value) { touchTimes(); draft.bedDate = t.value; draft.bedManual = true; updateLog(); return; }
    if (route === 'log' && t.id === 'date' && t.value) {
      touchTimes();
      if (t.value !== draft.date && entryOn(t.value)) draft = newDraft(t.value);
      else { var delta = dayDiff(t.value, draft.date); draft.date = t.value; draft.editing = !!entryOn(t.value); if (draft.bedManual) draft.bedDate = addDays(draft.bedDate, delta); }
      render(); return;
    }

  window.addEventListener('appinstalled', function () { deferred = null; toast('ติดตั้งแอปแล้ว'); });
  window.addEventListener('hashchange', function () {
    if (!user) return; var r = location.hash.slice(1);
    if (r.indexOf('day/') === 0) { if (route !== 'day' || param !== r.slice(4)) nav('day', false, r.slice(4)); }
    else if (VIEWS[r] && r !== 'day' && r !== route) nav(r);
  });

  /* ---------- start ---------- */
  boot();
})();
