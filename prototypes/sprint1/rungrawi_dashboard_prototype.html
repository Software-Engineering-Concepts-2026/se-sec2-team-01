<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Good Night — ภาพรวม</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- พิกัดสไตล์ชีต -->
<link rel="stylesheet" href="rungrawi_dashboard_prototype.css">

<!-- ไอคอน Lucide -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>

<div class="app">

  <!-- ============ Sidebar ============ -->
  <aside class="sidebar">
    <i data-lucide="sparkles" width="13" height="13" class="sparkle" style="top:6px;left:70%;animation-delay:.2s"></i>
    <i data-lucide="sparkles" width="9" height="9" class="sparkle" style="top:40px;left:18%;animation-delay:1.4s"></i>

    <div class="brand">
      <i data-lucide="moon-star" width="22" height="22"></i>
      <span>Good Night</span>
    </div>

    <nav id="sidenav">
      <button class="snav-item active" data-nav="home"><i data-lucide="home" width="17" height="17"></i><span>ภาพรวม</span></button>
      <button class="snav-item" data-nav="log"><i data-lucide="square-pen" width="17" height="17"></i><span>บันทึกการนอน</span></button>
      <button class="snav-item" data-nav="history"><i data-lucide="history" width="17" height="17"></i><span>ประวัติ</span></button>
      <button class="snav-item" data-nav="stats"><i data-lucide="bar-chart-3" width="17" height="17"></i><span>รายงาน</span></button>
      <button class="snav-item" data-nav="profile"><i data-lucide="user-round" width="17" height="17"></i><span>โปรไฟล์</span></button>
    </nav>

    <div class="sidebar-foot">
      <i data-lucide="flame" width="18" height="18" style="color:var(--amber)"></i>
      <div>
        <p class="label-sm" style="margin-bottom:2px">ต่อเนื่อง</p>
        <p style="font-size:14px;font-weight:600;color:var(--lavender)" id="streak-days">— วัน</p>
      </div>
    </div>
  </aside>

  <!-- ============ Main ============ -->
  <main class="main fade">
    <i data-lucide="sparkles" width="12" height="12" class="sparkle" style="top:10px;left:55%;animation-delay:0s"></i>
    <i data-lucide="sparkles" width="8" height="8" class="sparkle" style="top:36px;left:88%;animation-delay:1.8s"></i>

    <div class="topbar">
      <div>
        <h2 class="pagehead" id="greeting">สวัสดีตอนเช้า</h2>
        <p class="pagesub" id="today-date"></p>
      </div>
      <button class="icon-btn" id="refresh-btn" title="รีเฟรชข้อมูล"><i data-lucide="refresh-cw" width="17" height="17"></i></button>
    </div>

    <!-- แถวบน: คะแนน + สถิติย่อ -->
    <div class="grid-top">
      <div class="card score-card">
        <p class="label-sm" id="score-label"></p>
        <div id="score-ring"></div>
        <p style="font-size:12.5px;color:var(--text-secondary);margin-top:2px" id="score-word"></p>
        <button class="btn-primary" data-nav="stats" style="margin-top:6px;padding:10px 20px">
          <i data-lucide="bar-chart-3" width="15" height="15"></i> ดูรายงานฉบับเต็ม
        </button>
      </div>

      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="card nudge" id="nudge-card">
          <i data-lucide="square-pen" width="17" height="17" style="color:var(--lavender);flex-shrink:0"></i>
          <div style="flex:1">
            <p class="t">ยังไม่ได้บันทึกวันนี้</p>
            <p class="s">แตะเพื่อบันทึกเมื่อคืน</p>
          </div>
          <button class="btn-ghost" data-nav="log">บันทึก</button>
        </div>

        <div class="grid2b">
          <div class="card stat-tile"><p class="label-sm">เฉลี่ย 7 วัน</p><p class="num val" id="stat-avg">—</p></div>
          <div class="card stat-tile"><p class="label-sm">ต่อเนื่อง</p><p class="num val plain" id="stat-streak">—</p></div>
          <div class="card stat-tile"><p class="label-sm">เข้านอนเฉลี่ย</p><p class="num val plain" id="stat-bedtime">—</p></div>
          <div class="card stat-tile"><p class="label-sm">ตื่นเฉลี่ย</p><p class="num val plain" id="stat-wake">—</p></div>
        </div>
      </div>
    </div>

    <!-- แถวล่าง: กราฟรายวัน (กดได้) + รายละเอียดคืนที่เลือก / ข้อสังเกต -->
    <div class="grid-bottom">
      <div class="card chart-card">
        <p class="label-sm">คะแนนคุณภาพการนอนรายวัน · แตะแท่งเพื่อดูรายละเอียด</p>
        <div class="chart-bars" id="chart-bars"></div>
      </div>

      <div class="card" id="detail-card">
        <!-- เติมด้วย JS: รายละเอียดคืนที่เลือก -->
      </div>
    </div>

    <!-- ข้อสังเกตจากปัจจัยที่บันทึก -->
    <div class="card" style="margin-top:16px">
      <p class="label-sm" style="margin-bottom:12px">ข้อสังเกตจากปัจจัยที่บันทึก</p>
      <div style="display:flex;flex-direction:column;gap:12px" id="insights"></div>
    </div>

  </main>
</div>

<div class="toast" id="toast">
  <i data-lucide="info" width="15" height="15"></i>
  <span id="toast-text"></span>
</div>

<!-- ส่วนเชื่อมต่อไฟล์ JavaScript -->
<script src="rungrawi_dashbord_prototype_script.js"></script>
</body>
</html>
