<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Night</title>
    <link rel="stylesheet" href="adisak_SleepGoalSetup_style.css">
</head>
<body>

<div class="container">

    <!-- อายุ -->
    <div class="section">
        <label>อายุ</label>
        <select id="age">
            <option>20 ปี</option>
            <option>21 ปี</option>
            <option>22 ปี</option>
        </select>
    </div>

    <!-- ชั่วโมงการนอน -->
    <div class="section">
        <label>ช่วงอายุนี้ควรนอน</label>
        <input type="text" value="7-9 ชั่วโมง" readonly>
    </div>

    <!-- เวลานอน -->
    <div class="section">
        <label>เวลาที่ต้องการเข้านอน</label>

        <div class="clock-box">
            <div class="clock-circle">
                <div class="time">
                    <h2>21:00</h2>
                    <p>เวลานอน</p>
                </div>
            </div>

            <div class="time-picker">
                <label>หรือกรอกเอง</label>
                <input type="time" id="sleepTime" value="21:00">
            </div>
        </div>
    </div>

    <!-- ข้อความ -->
    <p>ตื่นเช้าที่ต้องการ เช่น 05:00</p>

    <!-- กิจกรรมก่อนนอน -->
    <div class="section">
        <label>เลือกกิจกรรมก่อนนอน</label>

        <div class="activities">

            <label>
                <input type="checkbox" value="ดื่มกาแฟ">
                ดื่มกาแฟ
            </label>

            <label>
                <input type="checkbox" value="ใช้โทรศัพท์">
                ใช้โทรศัพท์
            </label>

            <label>
                <input type="checkbox" value="ออกกำลังกาย">
                ออกกำลังกาย
            </label>

            <label>
                <input type="checkbox" value="อ่านหนังสือ">
                อ่านหนังสือ
            </label>

            <label>
                <input type="checkbox" value="ฟังเพลง">
                ฟังเพลง
            </label>

            <label>
                <input type="checkbox" value="ดื่มชา">
                ดื่มชา
            </label>

            <label>
                <input type="checkbox" value="ความรู้สึก/ความเครียด">
                ความรู้สึก/ความเครียด
            </label>

        </div>
    </div>

    <!-- ปุ่ม -->
    <button id="saveBtn">เริ่มใช้งาน</button>

</div>

<!-- ส่วนเชื่อมต่อไฟล์ JavaScript -->
<script src="adisak_SleepGoalSetup_script.js"></script>
</body>
</html>
